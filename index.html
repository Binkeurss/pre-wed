<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lễ Dạm Ngõ - Lâm Mạnh & Ngọc Ánh</title>
  
  <!-- Website Favicon & App Icon (Bông hoa hồng ở góc phải trên) -->
  <link rel="icon" type="image/png" href="assets/pink/lotus-top-right.png" data-asset="lotus-top-right.png">
  <link rel="shortcut icon" type="image/png" href="assets/pink/lotus-top-right.png" data-asset="lotus-top-right.png">
  <link rel="apple-touch-icon" href="assets/pink/lotus-top-right.png" data-asset="lotus-top-right.png">

  <!-- Google Fonts for Vietnamese Calligraphy & Serif Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Charm:wght@400;700&family=Charmonman:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Dancing+Script:wght@400;500;600;700&family=Great+Vibes&family=Noto+Serif:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Fullscreen Stage Container (100vw x 100vh) -->
  <main class="fullscreen-stage" id="fullscreen-stage" onclick="nextScene()">
    
    <!-- Single Unified Canvas Card -->
    <div class="card-unified">
      
      <!-- Double Border Frame with Margin Padding -->
      <div class="card-border-outer"></div>
      <div class="card-border-inner"></div>

      <!-- Lotus Assets (4 Independent Corners Framing the Card) -->
      <img src="assets/pink/lotus-top-left.png" data-asset="lotus-top-left.png" alt="Lotus Top Left Colored" class="asset-lotus asset-tl">
      <img src="assets/pink/lotus-top-right.png" data-asset="lotus-top-right.png" alt="Lotus Top Right Colored" class="asset-lotus asset-tr" id="lotus-music-toggle" onclick="event.stopPropagation(); toggleMusic();" title="Bấm vào bông sen để Bật / Tắt Nhạc Nền">
      <img src="assets/pink/lotus-bottom-left.png" data-asset="lotus-bottom-left.png" alt="Lotus Bottom Left" class="asset-lotus asset-bl">
      <img src="assets/pink/lotus-bottom-right.png" data-asset="lotus-bottom-right.png" alt="Lotus Bottom Right" class="asset-lotus asset-br">

      <!-- Fixed Header Title (Bấm vào "LỄ DẠM NGÕ" để đổi theme màu sắc & bộ ảnh) -->
      <div class="card-header-fixed">
        <h1 class="card-title" onclick="toggleTheme(event)" title="Bấm để đổi theme màu sắc (Green-Gold <-> Pink)">LỄ DẠM NGÕ</h1>
      </div>

      <!-- Dynamic Scenes Viewport (Chuyển trang tại chỗ) -->
      <div class="scenes-viewport">

        <!-- ================= PAGE 1 (SCENE 1: TÊN & 囍 & NGÀY THÁNG) ================= -->
        <div class="scene-panel scene-1 active" id="scene-1">
          
          <!-- Couple Names Section (Centered with 囍 Crest in the middle) -->
          <div class="couple-names-wrapper">
            <!-- Left Name (Lâm / Mạnh) -->
            <div class="name-block name-left">
              <div class="name-box">
                <span class="name-line line-first">Lâm</span>
                <span class="name-line line-second">Mạnh</span>
              </div>
            </div>

            <!-- Center 囍 Crest & Heart -->
            <div class="center-xi-crest">
              <div class="xi-symbol">囍</div>
              <div class="heart-icon-center" onclick="changeTrack(event)" title="Bấm để đổi bài hát">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
              </div>
            </div>

            <!-- Right Name (Ngọc / Ánh) -->
            <div class="name-block name-right">
              <div class="name-box">
                <span class="name-line line-first">Ngọc</span>
                <span class="name-line line-second">Ánh</span>
              </div>
            </div>
          </div>

          <!-- Bottom Section: Divider & Dates -->
          <div class="card-bottom-group">
            <!-- Divider Ornament (Asset F) -->
            <div class="divider-wrapper">
              <img src="assets/pink/divider-ornament.png" data-asset="divider-ornament.png" alt="Divider Flourish" class="divider-img">
            </div>

            <!-- Date Display -->
            <div class="date-block">
              <div class="solar-date">20.09.2026</div>
              <div class="lunar-date">(10.08.2026 Bính Ngọ)</div>
            </div>
          </div>

        </div> <!-- /scene-1 -->


        <!-- ================= PAGE 2 (SCENE 2: ĐOẠN THƠ TRĂM NĂM) ================= -->
        <div class="scene-panel scene-2" id="scene-2">
          
          <div class="scene-2-layout">
            <!-- Stepped Poetic Quote Container (Bounding Box Bài Thơ - Cột Trái) -->
            <div class="poem-stepped-wrapper">
              <div class="poem-line line-1">Một buổi</div>
              <div class="poem-line line-2">thưởng trà,</div>
              <div class="poem-line line-3">thưa chuyện</div>
              <div class="poem-line line-4">trăm năm</div>
            </div>

            <!-- GIF Cô Dâu Chú Rể (Bounding Box GIF - Cột Phải tự co giãn chống va chạm) -->
            <div class="gif-bounding-box">
              <div class="couple-illustration">
                <img src="assets/pink/couple-thank-you.gif" data-asset="couple-thank-you.gif" alt="Cô dâu chú rể cúi chào cảm ơn" class="couple-gif-img">
              </div>
            </div>
          </div>

        </div> <!-- /scene-2 -->

      </div> <!-- /scenes-viewport -->

    </div> <!-- /card-unified -->

  </main> <!-- /fullscreen-stage -->

  <!-- Background Music Audio Element -->
  <audio id="bg-music" preload="auto">
    <source id="music-source" src="assets/mp3/ngay_hanh_phuc.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
